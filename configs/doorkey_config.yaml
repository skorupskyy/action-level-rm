# ==============================================================================
# Experiment Configuration
# ==============================================================================

experiment:
  name: "rm_ppo_doorkey"
  seed: 42
  device: "auto"                    # "auto", "mps", "cpu", or "cuda"

# ==============================================================================
# RL Agent Selection
# ==============================================================================
# Options:
#   - "rm_ppo":              PPO guided by fine-tuned DeBERTa Action-Level RM
#   - "baseline_ppo":        PPO with sparse environment reward only
#   - "intrinsic_ppo":       PPO with count-based novelty exploration bonus
#   - "reward_shaping_ppo":  PPO with hardcoded milestone reward shaping
agent:
  type: "rm_ppo"

# ==============================================================================
# Environment Configuration
# ==============================================================================
environment:
  env_id: "MiniGrid-DoorKey-8x8-v0"
  max_episode_steps: 200
  render_mode: "rgb_array"

# ==============================================================================
# Reward Model Configuration (for "rm_ppo")
# ==============================================================================
reward_model:
  model_name: "microsoft/deberta-v3-small"
  lora_path: "./reward-model-lora-doorkey"
  step_penalty: -0.02               # Calibrated motion step cost to encourage spatial exploration
  collision_penalty: -0.25          # Calibrated wall collision penalty (-0.25 strictly below regressive -0.15)
  ineffective_penalty: -0.25        # Inaction penalty for invalid in-place no-ops & 2nd+ turns
  max_stall_steps: 0                # 0 = disabled (allows full 200-step exploration without early truncation)
  use_cache: true                   # In-memory LRU cache to accelerate inference
  cache_size: 10000                 # Maximum cached text-to-reward entries
  selective_eval: false             # Set to false to evaluate directional guidance on all steps
  early_term_on_penalty: false      # If true, terminates episode on severe penalty (<= -2.0)
  include_env_oracle: false         # Pure RM guidance

# ==============================================================================
# Dataset Configuration (for RM Fine-Tuning)
# ==============================================================================
dataset:
  data_path: "data/doorkey_reward_dataset_balanced.csv"
  balanced_downsampling: false      # Already stratified and balanced in dataset file
  sample_size: null                 # Use all 3,200 curated balanced records
  unique_prompt_split: true         # Guarantees test set is 100% unique unseen prompts (zero train overlap)
  train_split: 0.8                  # 80% train, 20% test
  text_column: "text"
  label_column: "reward"

# ==============================================================================
# RM Supervised Fine-Tuning Hyperparameters
# ==============================================================================
rm_training:
  epochs: 6
  batch_size: 32
  learning_rate: 1.5e-4
  weight_decay: 0.01
  max_length: 96
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.1
  target_modules: ["value_proj", "query_proj"]
  modules_to_save: ["classifier", "pooler", "score"]
  output_dir: "./reward-model-lora-doorkey"
  log_dir: "./logs/rm_training"
  eval_strategy: "epoch"
  save_strategy: "epoch"
  early_stopping_patience: 2
  save_total_limit: 3

# ==============================================================================
# RL Policy Training Hyperparameters (PPO)
# ==============================================================================
rl_training:
  total_timesteps: 200000           # 200k verification run
  learning_rate: 3.0e-4
  min_learning_rate: 1.0e-4         # Minimum learning rate threshold (decays from 3e-4 to 1e-4)
  lr_schedule: "linear"             # "linear" decay to min_learning_rate, or "constant"
  gamma: 0.999                      # High discount factor for long-horizon credit assignment
  n_steps: 2048
  batch_size: 256
  n_epochs: 10
  clip_range: 0.2
  ent_coef: 0.05                    # Boosted entropy to maintain active exploration
  features_dim: 128
  log_dir: "./logs/rm_ppo"
  save_model_path: "./models/rm_ppo_agent"

# ==============================================================================
# Intrinsic Motivation Settings (for "intrinsic_ppo")
# ==============================================================================
intrinsic_motivation:
  beta: 0.05                        # Novelty bonus scale: beta / sqrt(N(s, a))
  count_type: "state_action"        # "state_action" (N(s, a)) or "state_only" (N(s))

# ==============================================================================
# Reward Shaping Baseline Settings (for "reward_shaping_ppo")
# ==============================================================================
reward_shaping:
  key_pickup_reward: 2.0
  door_open_reward: 3.0
  goal_reward: 10.0
  step_penalty: -0.02
  collision_penalty: -0.25
  ineffective_penalty: -0.25
  anti_farming_penalty: -2.5
  max_stall_steps: 0                # 0 = disabled (allows full 200-step exploration without early truncation)

# ==============================================================================
# Evaluation and Visualization Settings
# ==============================================================================
evaluation:
  model_path: "./models/rm_agent_doorkey"
  num_eval_episodes: 10
  num_behavior_analysis_episodes: 50
  num_trajectory_plots: 5
  num_heatmap_simulations: 100
  output_dir: "./eval_results"
