# Action-Level Reward Model Guided PPO
experiment:
  name: "rm_ppo_doorkey"
  seed: 42
  device: "auto"

agent:
  type: "rm_ppo"

environment:
  env_id: "MiniGrid-DoorKey-8x8-v0"
  max_episode_steps: 200
  render_mode: "rgb_array"

reward_model:
  model_name: "microsoft/deberta-v3-small"
  lora_path: "./reward-model-lora-doorkey"
  step_penalty: -0.1
  use_cache: true
  cache_size: 10000
  selective_eval: false
  early_term_on_penalty: false
  include_env_oracle: false

rl_training:
  total_timesteps: 1000000
  learning_rate: 3.0e-4
  lr_schedule: "linear"
  gamma: 0.999
  n_steps: 2048
  batch_size: 256
  n_epochs: 10
  clip_range: 0.2
  ent_coef: 0.01
  features_dim: 128
  log_dir: "./logs/rm_ppo"
  save_model_path: "./models/rm_agent_doorkey"

evaluation:
  model_path: "./models/rm_agent_doorkey"
  num_eval_episodes: 10
  num_behavior_analysis_episodes: 50
  num_trajectory_plots: 5
  num_heatmap_simulations: 100
  output_dir: "./eval_results/rm_ppo"
