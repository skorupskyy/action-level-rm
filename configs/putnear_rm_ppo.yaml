# Action-Level RM Guided PPO on PutNear-8x8-N3
experiment:
  name: "putnear_rm_ppo"
  seed: 42
  device: "auto"

agent:
  type: "rm_ppo"

environment:
  env_id: "MiniGrid-PutNear-8x8-N3-v0"
  max_episode_steps: 100
  render_mode: "rgb_array"

reward_model:
  model_name: "microsoft/deberta-v3-small"
  lora_path: "./reward-model-lora-putnear"
  step_penalty: -0.02
  collision_penalty: -0.25
  ineffective_penalty: -0.25
  anti_farming_penalty: -2.50
  wrong_pickup_penalty: -3.50
  active_rejection_bonus: 0.05
  max_stall_steps: 0
  use_cache: true
  cache_size: 10000
  selective_eval: false
  early_term_on_penalty: false
  include_env_oracle: false

policy:
  is_multimodal: true
  policy_type: "MultiInputPolicy"
  extractor: "slot"
  features_dim: 128

rl_training:
  total_timesteps: 2000000
  learning_rate: 3.0e-4
  min_learning_rate: 1.0e-4
  lr_schedule: "linear"
  gamma: 0.999
  n_steps: 2048
  batch_size: 256
  n_epochs: 10
  clip_range: 0.2
  ent_coef: 0.03
  features_dim: 128
  log_dir: "./logs/putnear_rm_ppo"
  save_model_path: "./models/putnear_rm_ppo_agent"

evaluation:
  model_path: "./models/putnear_rm_ppo_agent"
  num_eval_episodes: 20
  num_behavior_analysis_episodes: 100
  num_trajectory_plots: 5
  num_heatmap_simulations: 100
  output_dir: "./eval_results/putnear_rm_ppo"

