# Reward Shaping PPO Baseline (Heuristic / Oracle Sub-goal Milestones)
experiment:
  name: "reward_shaping_ppo_doorkey"
  seed: 42
  device: "auto"

agent:
  type: "reward_shaping_ppo"

environment:
  env_id: "MiniGrid-DoorKey-8x8-v0"
  max_episode_steps: 200
  render_mode: "rgb_array"

reward_shaping:
  key_pickup_reward: 2.0
  door_open_reward: 3.0
  goal_reward: 10.0
  step_penalty: -0.02
  collision_penalty: -0.25
  anti_farming_penalty: 0.0
  ineffective_penalty: -0.25
  enable_anti_farming: false        # Explicitly disabled to demonstrate the reward farming loop
  max_stall_steps: 0

rl_training:
  total_timesteps: 1000000
  learning_rate: 3.0e-4
  min_learning_rate: 1.0e-4
  lr_schedule: "linear"
  gamma: 0.999
  n_steps: 2048
  batch_size: 256
  n_epochs: 10
  clip_range: 0.2
  ent_coef: 0.05
  features_dim: 128
  log_dir: "./logs/reward_shaping_ppo"
  save_model_path: "./models/rs_agent_doorkey"

evaluation:
  model_path: "./models/rs_agent_doorkey"
  num_eval_episodes: 10
  num_behavior_analysis_episodes: 50
  num_trajectory_plots: 5
  num_heatmap_simulations: 100
  output_dir: "./eval_results/reward_shaping_ppo"
