# ==============================================================================
# PutNear Experiment Configuration (MiniGrid-PutNear-8x8-N3-v0)
# ==============================================================================

experiment:
  name: "putnear_rm_ppo"
  seed: 42
  device: "auto"                    # "auto", "mps", "cpu", or "cuda"

# ==============================================================================
# RL Agent Selection
# ==============================================================================
# Options:
#   - "rm_ppo":              PPO guided by fine-tuned DeBERTa Action-Level RM
#   - "baseline_ppo":        PPO with sparse environment reward only
#   - "intrinsic_ppo":       PPO with count-based novelty exploration bonus
#   - "reward_shaping_ppo":  PPO with hardcoded milestone reward shaping
agent:
  type: "rm_ppo"

# ==============================================================================
# Environment Configuration
# ==============================================================================
environment:
  env_id: "MiniGrid-PutNear-8x8-N3-v0"
  max_episode_steps: 100            # Standard benchmark horizon for PutNear-8x8
  render_mode: "rgb_array"

# ==============================================================================
# Reward Model Configuration (for "rm_ppo")
# ==============================================================================
reward_model:
  model_name: "microsoft/deberta-v3-small"
  lora_path: "./reward-model-lora-putnear"
  step_penalty: -0.02               # Calibrated motion step cost to encourage path efficiency
  collision_penalty: -0.25          # Wall / obstacle collision penalty
  ineffective_penalty: -0.25        # Inaction penalty for invalid in-place no-ops & 2nd+ turns
  anti_farming_penalty: -2.50       # Calibrated premature drop penalty
  wrong_pickup_penalty: -3.50       # Severe penalty for wrong object pickup (forces EV < 0 on random guess)
  active_rejection_bonus: 0.05      # Active rejection bonus for turning away from wrong objects
  max_stall_steps: 0                # 0 = disabled
  use_cache: true                   # In-memory LRU cache to accelerate inference
  cache_size: 10000                 # Maximum cached text-to-reward entries
  selective_eval: false             # Set to false to evaluate directional guidance on all steps
  early_term_on_penalty: false      # If true, terminates episode on severe penalty (<= -2.0)
  include_env_oracle: false         # Pure RM guidance

# ==============================================================================
# Dataset Configuration (for RM Fine-Tuning)
# ==============================================================================
dataset:
  data_path: "data/putnear_reward_dataset_balanced.csv"
  balanced_downsampling: false      # Already stratified and balanced in dataset file
  sample_size: null                 # Use all 3,500 curated balanced records
  unique_prompt_split: true         # Guarantees test set is 100% unique unseen prompts (zero train overlap)
  train_split: 0.8                  # 80% train, 20% test
  text_column: "text"
  label_column: "reward"

# ==============================================================================
# RM Supervised Fine-Tuning Hyperparameters
# ==============================================================================
rm_training:
  epochs: 6
  batch_size: 32
  learning_rate: 1.5e-4
  weight_decay: 0.01
  max_length: 128                   # 128 tokens accommodates full relational prompt
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.1
  target_modules: ["value_proj", "query_proj"]
  modules_to_save: ["classifier", "pooler", "score"]
  output_dir: "./reward-model-lora-putnear"
  log_dir: "./logs/rm_training_putnear"
  eval_strategy: "epoch"
  save_strategy: "epoch"
  early_stopping_patience: 2
  save_total_limit: 3

# ==============================================================================
# RL Policy Training Hyperparameters (PPO)
# ==============================================================================
policy:
  is_multimodal: true               # Multimodal vision + language policy
  policy_type: "MultiInputPolicy"   # SB3 Dict observation policy
  extractor: "slot"                 # "slot" (lightweight ~156k params), "film", or "concat"
  features_dim: 128                 # Fused policy feature representation dimension

rl_training:
  total_timesteps: 1000000           # 1M timesteps for full convergence
  learning_rate: 3.0e-4
  min_learning_rate: 1.0e-4         # Linear decay from 3e-4 to 1e-4
  lr_schedule: "linear"
  gamma: 0.99                       # Standard discount factor
  n_steps: 2048
  batch_size: 256
  n_epochs: 10
  clip_range: 0.2
  ent_coef: 0.02                    # Calibrated entropy for sharp decision boundaries
  features_dim: 128
  log_dir: "./logs/putnear_rm_ppo"
  save_model_path: "./models/putnear_rm_ppo_agent"

# ==============================================================================
# Intrinsic Motivation Settings (for "intrinsic_ppo")
# ==============================================================================
intrinsic_motivation:
  beta: 0.05                        # Novelty bonus scale: beta / sqrt(N(s, a))
  count_type: "state_action"        # "state_action" or "state"

# ==============================================================================
# Heuristic Reward Shaping Settings (for "reward_shaping_ppo")
# ==============================================================================
reward_shaping:
  key_pickup_reward: 2.0            # Move object pickup bonus
  goal_reward: 10.0                 # Target placement bonus
  step_penalty: -0.02
  collision_penalty: -0.25
  anti_farming_penalty: -2.50
  wrong_pickup_penalty: -3.50
  active_rejection_bonus: 0.05
  ineffective_penalty: -0.25
  max_stall_steps: 0
  enable_anti_farming: true

# ==============================================================================
# Evaluation & Visualizations
# ==============================================================================
evaluation:
  model_path: "./models/putnear_rm_ppo_agent.zip"
  num_eval_episodes: 20
  num_behavior_analysis_episodes: 100
  num_trajectory_plots: 5
  num_heatmap_simulations: 100
  output_dir: "./eval_results/putnear_rm_ppo"

